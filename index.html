/* V3: consistent UI; dashboard cards and charts never grow outside columns */
.dashgrid,.two-col{min-width:0}.dashgrid>.panel,.two-col>.panel{min-width:0;overflow:hidden}
.chartbox,.chartbox canvas{max-width:100%!important;width:100%!important;min-width:0;min-height:0}.chartbox{height:155px!important;overflow:hidden;position:relative}
.chartbox canvas{height:100%!important;max-height:100%!important;display:block}
.chartcontain{width:100%;max-width:100%;min-width:0;height:165px;overflow:hidden;position:relative}
.stat{min-width:0;height:126px;max-height:126px;overflow:hidden}.stat .statvalue,.stat .statnote{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban>*{min-width:0;overflow:hidden}.softfill{min-width:0;overflow:hidden}.softfill h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dashcompact td,.dashcompact th{font-size:10px!important;padding:5px 7px!important;white-space:nowrap}.dashcompact{table-layout:auto}
.table td{vertical-align:middle}.table .tiny{padding:5px 8px}
.result-good{color:var(--success);font-weight:750}.status-hover{cursor:help;display:inline-block}.smallbreak{overflow-wrap:anywhere}
.userpill{min-width:0}.topbar{min-width:0}.section{min-width:0}.tablewrap{max-width:100%}
button,select,.btn,[role='button']{cursor:pointer}input,textarea,[contenteditable='true']{cursor:text}
input[type='checkbox'],input[type='radio']{cursor:pointer}input[type='number']{cursor:text}
input[type='date']:focus,input[type='time']:focus,input[type='number']:focus{cursor:text}
.profile-controls{max-width:260px;min-width:0}.formgrid{min-width:0}
.stage-popup-table td,.stage-popup-table th{font-size:11px;padding:7px 9px}
.audit-wide{width:min(1200px,96vw)!important;max-width:96vw!important}.audit-grid{min-width:1090px}.audit-grid th,.audit-grid td{font-size:10px!important;padding:5px 7px!important;white-space:nowrap}
.audit-grid th{position:sticky;top:0;z-index:2}.audit-detail{max-width:650px;overflow:auto;font-size:11px}
.trendhead{font:800 20px 'Plus Jakarta Sans',sans-serif;margin:10px 0 14px}
.trend-table th{white-space:nowrap}.trend-table td{font-size:11px}
.stage-summary td,.stage-summary th{font-size:11px;padding:9px 10px}
.stage-cell{min-width:135px;white-space:normal}.stage-cell .tag{font-size:10px}
.slimcells td,.slimcells th{font-size:11px;padding:7px 8px}
.pagebody{min-width:0}
@media(max-width:960px){.dashgrid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.kanban{grid-template-columns:1fr 1fr}.chartbox{height:145px!important}}


/* QC LabFlow ONE V4 refinements */
.analyst-tab-selector{display:flex;flex-wrap:wrap;gap:9px;padding:11px;margin-bottom:15px}
.analyst-tab-selector .btn{flex:0 1 auto;min-width:140px}
.readonly-info{display:flex;flex-wrap:wrap;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--muted);font-size:11px}
.readonly-info b{color:var(--text)}
.trend-scroll{max-height:520px;max-width:100%;overflow:auto}
.trend-matrix{min-width:max-content;border-collapse:separate;border-spacing:0}
.trend-matrix th,.trend-matrix td{border-right:1px solid var(--line);padding:8px 11px;white-space:nowrap}
.trend-matrix thead tr:first-child th{top:0;background:var(--surface2);z-index:3}
.trend-matrix thead tr:nth-child(2) th{top:35px;z-index:2}
.trend-matrix thead tr:first-child th.trend-group-head{text-align:center;background:var(--ring);color:var(--primary);height:35px;font-weight:800;letter-spacing:.35px}
.trend-matrix .trend-batch-head{min-width:150px;position:sticky;left:0;z-index:5!important;background:var(--surface2)!important}
.trend-matrix tbody td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px}
.trend-matrix tbody tr:hover td:first-child{background:var(--surface2)}
.trend-matrix .trend-ar{font-weight:700;color:var(--primary)}
.trend-matrix .trend-sub-head{font-size:10px;color:var(--text);min-width:110px}
@media(max-width:650px){.analyst-tab-selector .btn{flex:1 1 100%}}

/* V4.2: elegant Summary hover card; database and data operations unchanged */
.status-hover{cursor:help;display:inline-flex;align-items:center;border-radius:999px;outline-offset:4px;transition:transform .2s ease,box-shadow .2s ease}
.status-hover:hover,.status-hover:focus-visible{transform:translateY(-2px);filter:brightness(.99)}
.status-hover:hover .tag,.status-hover:focus-visible .tag{box-shadow:0 4px 15px var(--ring)}
.qc-status-popover{position:fixed;z-index:120;width:min(390px,calc(100vw - 24px));max-height:min(440px,calc(100vh - 24px));overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:0 20px 54px rgba(13,34,57,.26),0 2px 12px var(--ring);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;line-height:1.55;pointer-events:none;animation:qcTipIn .16s ease both}
.qc-tip-head{position:relative;padding:15px 16px 13px;background:linear-gradient(110deg,var(--surface2),var(--surface));border-bottom:1px solid var(--line);padding-right:100px}
.qc-tip-eyebrow{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--primary);margin-bottom:3px}
.qc-tip-name{font-size:14px;font-weight:800;letter-spacing:-.3px;line-height:1.4;color:var(--text)}
.qc-tip-count{position:absolute;right:14px;top:17px;border:1px solid var(--line);color:var(--muted);background:var(--surface);font-size:10px;font-weight:750;border-radius:30px;padding:5px 8px;white-space:nowrap}
.qc-tip-content{max-height:min(358px,calc(100vh - 105px));overflow:hidden;padding:4px 14px 8px}
.qc-tip-attempt{padding:10px 2px;border-bottom:1px solid var(--line)}
.qc-tip-attempt:last-child{border-bottom:0}
.qc-tip-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;overflow-wrap:anywhere}.qc-tip-meta>b{font-size:11px;line-height:1.3}.qc-tip-meta>.tag{font-size:9px;padding:3px 8px}
.qc-tip-date{display:flex;flex-wrap:wrap;gap:3px 15px;color:var(--muted);font-size:10px;margin:7px 0}.qc-tip-date b{color:var(--text)}

 const pulledStations=activeStations.filter(s=>s.pulled_at&&[receiptFor(s).batch_no,productName(receiptFor(s).product_id),s.ar_no,stabilityStationLabel(s)].some(v=>String(v||'').toLowerCase().includes(allocationSearch.toLowerCase()))).sort((a,b)=>a.scheduled_date.localeCompare(b.scheduled_date));
 const allocationProducts=[...new Set(pulledStations.map(s=>receiptFor(s).product_id))].map(id=>({id,stations:pulledStations.filter(s=>receiptFor(s).product_id===id)})).sort((a,b)=>productName(a.id).localeCompare(productName(b.id)));
 const workflow=results.flatMap(t=>{const s=activeStations.find(s=>s.id===t.station_id&&s.pulled_at);return s&&t.assigned_to?[{t,s,r:receiptFor(s)}]:[]}).filter(({t,s,r})=>(!workflowAnalyst||t.assigned_to===workflowAnalyst)&&(!workflowStatus||(done(t)?'Completed':'Under Test')===workflowStatus)&&[r.batch_no,productName(r.product_id),s.ar_no,t.test_name,stabilityStationLabel(s),t.assigned_to].some(v=>String(v||'').toLowerCase().includes(workflowSearch.toLowerCase()))).sort((a,b)=>String(b.t.assigned_at).localeCompare(String(a.t.assigned_at)));
 const productReceipts=receipts.filter(r=>r.product_id===Number(summaryProduct)).sort((a,b)=>compareBatchSeries(a.batch_no,b.batch_no));
 const summaryReceipts=testView?productReceipts:productReceipts.filter(r=>r.id===summaryReceipt);
 const summaryStations=activeStations.filter(s=>summaryReceipts.some(r=>r.id===s.receipt_id)&&(conditionFilter==='All'||s.condition===conditionFilter)&&(!timeFilter||s.month_no===Number(timeFilter)));
 const summaryTests=[...new Map(results.filter(t=>summaryStations.some(s=>s.id===t.station_id)).map(t=>[String(t.master_test_id),{id:String(t.master_test_id),name:t.test_name,unit:t.unit,type:t.result_type}])).values()];
 const selectedChartTest=summaryTests.find(t=>t.id===chartTest)||summaryTests[0];
 const lookup=(s,id)=>results.find(t=>t.station_id===s.id&&String(t.master_test_id)===id),displayResult=t=>t&&done(t)?t.result:'—';
 const summarySheets=['ACC','RT'].filter(c=>conditionFilter==='All'||conditionFilter===c).map(c=>{const ss=summaryStations.filter(s=>s.condition===c).sort((a,b)=>a.month_no-b.month_no);if(testView){return [c+' Batch Comparison',[['Batch No','Plant','Packing Type','Time Point',...summaryTests.map(t=>t.name+(t.unit?' ('+t.unit+')':''))],...summaryReceipts.flatMap(r=>ss.filter(s=>s.receipt_id===r.id).map(s=>[r.batch_no,r.plant,r.packing_type,s.month_no+'M',...summaryTests.map(t=>displayResult(lookup(s,t.id)))]))]]}const months=[...new Set(ss.map(s=>s.month_no))];return [c+' Batch Time Points',[['Test / Parameter',...months.map(m=>m+' Months')],...summaryTests.map(t=>[t.name+(t.unit?' ('+t.unit+')':''),...months.map(m=>displayResult(lookup(ss.find(s=>s.month_no===m)||{},t.id)))])]]});
 const chartDatasets=selectedChartTest?.type==='numeric'?summaryReceipts.flatMap(r=>['ACC','RT'].filter(c=>conditionFilter==='All'||conditionFilter===c).map(c=>{const ss=summaryStations.filter(s=>s.receipt_id===r.id&&s.condition===c).sort((a,b)=>a.month_no-b.month_no);return {label:`${r.batch_no} · ${r.plant} · ${r.packing_type} · ${c}`,data:ss.map(s=>{const t=lookup(s,selectedChartTest.id);return {x:s.month_no,y:done(t||{})?stabilityNumeric(t.numeric_result??t.result):null}})}}).filter(d=>d.data.some(p=>p.y!==null))):[];
 const allTimepoints=[...new Set(activeStations.filter(s=>productReceipts.some(r=>r.id===s.receipt_id)).map(s=>s.month_no))].sort((a,b)=>a-b);
 const exportSummary=()=>{const flat=[['Batch No','Plant','Packing Type','Condition','Time Point (Months)','AR No','Scheduled Date','Pullout Date','Test','Result','Unit','Analyst','Completion Date'],...summaryStations.flatMap(s=>{const r=receiptFor(s);return testsFor(s).map(t=>[r.batch_no,r.plant,r.packing_type,s.condition,s.month_no,s.ar_no||'',stabilityDateDisplay(s.scheduled_date),s.pullout_date?stabilityDateDisplay(s.pullout_date):'',t.test_name,done(t)?t.result:'',t.unit||'',analystDisplay(t.assigned_to),t.completion_date?stabilityDateDisplay(t.completion_date):''])})];exportSheets([...summarySheets,['Filtered Result Details',flat]],`Stability_Summary_${productBy(summaryProduct)?.product_code||'Product'}.xlsx`)};
 const pageRows=(a,p,per=20)=>a.slice((p-1)*per,p*per);
 return <div className="stability-workspace" aria-busy={saving}>
  <div className="stability-banner"><div><span className="eyebrow">STABILITY MANAGER</span><h2>{page}</h2><p>Receipt → time point → pullout → testing → results</p></div><span className="tag blue">ACC + RT</span></div>

   <section className="panel section"><div className="sectionhead"><h2>01 · Link registered product</h2><span className="small">Shared with original Product Setup</span></div><div className="stability-inline"><div className="formrow" style={{flex:1}}><label>Registered product</label><ProductLookup products={masters} value={productBy(setupProduct)?.product_code||''} onSelect={code=>changeProduct(String(masters.find(p=>p.product_code===code)?.id||''))}/></div><button className="btn primary" disabled={!setupProduct||enabled.some(p=>p.product_id===Number(setupProduct))} onClick={()=>call('stability_set_product',{p_product_id:Number(setupProduct),p_active:true},'Product linked to Stability Manager')}>＋ Link product</button></div><p className="small">Product codes and names come from the existing product register. Stability tests are configured separately below.</p></section>
   {!testEdit&&<section className="panel section"><div className="sectionhead"><h2>02 · Stability test setup</h2><span className="small">Add multiple test rows, then save together</span></div><form onSubmit={saveTests}><div className="formrow"><label>Product</label><ProductLookup products={masters.filter(p=>enabled.some(x=>x.product_id===p.id))} value={productBy(setupProduct)?.product_code||''} onSelect={code=>changeProduct(String(masters.find(p=>p.product_code===code)?.id||''))} placeholder="Type code or name; select a linked product"/></div><p className="small">These tests apply to every ACC / RT station of future studies.</p><div className="testbuilder stability-testbuilder">{testRows.map((t,i)=><div className="stability-build-row" key={i}><input className="field" aria-label={'Test '+(i+1)} placeholder={'Test '+(i+1)} value={t.test_name} onChange={e=>setTestRows(v=>v.map((x,k)=>k===i?{...x,test_name:e.target.value}:x))}/><input className="field" aria-label={'Instrument '+(i+1)} placeholder="Instrument" value={t.instrument} onChange={e=>setTestRows(v=>v.map((x,k)=>k===i?{...x,instrument:e.target.value}:x))}/><select aria-label={'Result format '+(i+1)} value={t.result_type} onChange={e=>setTestRows(v=>v.map((x,k)=>k===i?{...x,result_type:e.target.value}:x))}><option value="numeric">Numeric</option><option value="text">Text</option></select><input className="field" aria-label={'Result unit '+(i+1)} placeholder="Unit, e.g. %" value={t.unit} onChange={e=>setTestRows(v=>v.map((x,k)=>k===i?{...x,unit:e.target.value}:x))}/><button type="button" className="btn tiny danger" aria-label={'Remove test row '+(i+1)} disabled={testRows.length===1} onClick={()=>setTestRows(v=>v.filter((_,k)=>k!==i))}>✕</button></div>)}<button className="btn tiny" type="button" onClick={()=>setTestRows(v=>[...v,{test_name:'',instrument:'',result_type:'numeric',unit:''}])}>＋ Add test</button></div><button className="btn primary" style={{marginTop:12}} disabled={!setupProduct}>Save stability tests</button></form></section>}
   {testEdit&&<>
   <section className="panel section"><div className="sectionhead"><h2>02 · {testEdit?'Edit stability test':'Add stability test'}</h2><span className="small">Same test set for every ACC / RT station</span></div><form onSubmit={saveTest}><div className="formgrid three"><div className="formrow"><label>Linked product</label><select aria-label="Linked product for stability tests" required value={setupProduct} onChange={e=>changeProduct(e.target.value)}><option value="">Select product</option>{enabled.map(p=><option value={p.product_id} key={p.product_id}>{productName(p.product_id)}</option>)}</select></div><div className="formrow"><label>Test / parameter</label><input className="field" required value={testForm.test_name} onChange={e=>setTestForm(v=>({...v,test_name:e.target.value}))}/></div><div className="formrow"><label>Instrument</label><input className="field" value={testForm.instrument} onChange={e=>setTestForm(v=>({...v,instrument:e.target.value}))}/></div><div className="formrow"><label>Result format</label><select value={testForm.result_type} onChange={e=>setTestForm(v=>({...v,result_type:e.target.value}))}><option value="numeric">Numeric · graph enabled</option><option value="text">Text · e.g. appearance / complies</option></select></div><div className="formrow"><label>Result unit</label><input className="field" placeholder="%, mg, ppm…" value={testForm.unit} onChange={e=>setTestForm(v=>({...v,unit:e.target.value}))}/></div><div className="formrow"><label>Action</label><div className="actions"><button className="btn primary" disabled={!enabled.some(p=>p.product_id===Number(setupProduct))}>{testEdit?'Save changes':'＋ Add test'}</button>{testEdit&&<button className="btn" type="button" onClick={resetTest}>Cancel</button>}</div></div></div></form></section>
   </>}
   <section className="panel section"><div className="sectionhead"><h2>Registered stability products & tests</h2><span className="small">Existing study test snapshots are retained after setup changes</span></div>{enabled.map(p=><div className="stability-product" key={p.product_id}><div className="sectionhead"><div><b>{productName(p.product_id)}</b><div className="small">{productBy(p.product_id)?.product_code}</div></div><div className="actions"><button className="btn tiny" onClick={()=>onEditProduct(productBy(p.product_id))}>Edit product</button><button className="btn tiny" onClick={()=>{changeProduct(String(p.product_id));window.scrollTo({top:0,behavior:'smooth'})}}>Edit / add tests</button><button className="btn tiny danger" onClick={async()=>{if(await confirmAction('Remove stability product setup?','Hide this product from future stability receipt entry? Existing studies and the original product register are retained.','Remove setup'))await call('stability_set_product',{p_product_id:p.product_id,p_active:false},'Stability product setup removed')}}><StabilityTrash/> Delete setup</button></div></div><div className="tablewrap"><table className="table slimcells"><thead><tr><th>Test</th><th>Instrument</th><th>Result format</th><th>Unit</th><th>Actions</th></tr></thead><tbody>{testMaster.filter(t=>t.product_id===p.product_id&&t.active).map(t=><tr key={t.id}><td>{t.test_name}</td><td>{t.instrument||'—'}</td><td>{t.result_type}</td><td>{t.unit||'—'}</td><td><div className="actions"><button className="btn tiny" onClick={()=>{setSetupProduct(String(p.product_id));setTestEdit(t.id);setTestForm({test_name:t.test_name,instrument:t.instrument||'',result_type:t.result_type,unit:t.unit||''});window.scrollTo({top:0,behavior:'smooth'})}}>Edit</button><button className="btn tiny danger" aria-label={'Delete '+t.test_name} onClick={async()=>{if(await confirmAction('Delete test from future studies?',t.test_name+' will remain in existing receipt worksheets.','Delete test'))await call('stability_save_test',{p_product_id:p.product_id,p_id:t.id,p_data:{...t,active:false}},'Test removed from future studies')}}><StabilityTrash/></button></div></td></tr>)}</tbody></table></div>{!testMaster.some(t=>t.product_id===p.product_id&&t.active)&&<div className="empty">Add stability tests for this product.</div>}</div>)}{!enabled.length&&<div className="empty">Link a registered product to start.</div>}</section>
  </>}
  {page==='Sample Receipt'&&<>
   <section className="panel section"><div className="sectionhead"><h2>{receiptEdit?'Edit stability receipt':'Register stability sample receipt'}</h2>{receiptEdit&&<button className="btn tiny" onClick={()=>{setReceipt(stabilityReceiptBlank());setReceiptEdit(null)}}>Cancel edit</button>}</div><form onSubmit={saveReceipt}>{receiptLocked&&<div className="notice">A pullout is already recorded. Schedule details and quantity unit are locked. Quantities, batch size and packing details can be corrected; withdrawal history stays intact.</div>}<div className="formgrid three">

    {field('batch_no','Batch No')}{field('mfg_date','Manufacture date','date')}{field('exp_date','Expiry date','date')}{field('batch_size','Batch size')}{field('packing_type','Packing type')}{field('received_date','Sample receipt date','date')}{field('received_time','Sample receipt time (optional)','time',false)}{field('fg_release_date','FG release date','date')}{field('qty_acc','ACC sample quantity','number',true,{min:0,step:1})}{field('qty_rt','RT sample quantity','number',true,{min:0,step:1})}
    <div className="formrow"><label htmlFor="st-unit">Quantity unit</label><select id="st-unit" disabled={receiptLocked} value={receipt.qty_unit} onChange={e=>setReceipt(v=>({...v,qty_unit:e.target.value}))}>{['Tablets','Capsules','Bottles','Tubes'].map(v=><option key={v}>{v}</option>)}</select></div>
   </div><label className="small">Stability reason</label><div className="stability-reasons">{['Validation','Annual','Special'].map(v=><label className={receipt.reason===v?'selected':''} key={v}><input type="radio" disabled={receiptLocked} name="stability-reason" value={v} checked={receipt.reason===v} onChange={()=>setReceipt(r=>({...r,reason:v}))}/>{v==='Annual'?'Annual batch':v}</label>)}</div>

   <div className="stability-preview"><div><b>Shelf life: {stabilityShelf(receipt.mfg_date,receipt.exp_date)||'—'} months</b><span className="small">Inclusive MFG–EXP calendar months{receipt.reason==='Validation'?' · RT endpoint = shelf life + 12 months':''}</span></div>{previewError?<p>{previewError}</p>:<><div><span className="tag blue">ACC</span> {accPreview.map(m=>m+'M').join(' · ')||'No time points'}</div><div><span className="tag green">RT</span> {rtPreview.map(m=>m+'M').join(' · ')||'Enter manufacture and expiry dates'}</div></>}</div>

   <section className="panel section"><div className="sectionhead"><h2>Registered sample receipts</h2><input className="field" style={{maxWidth:300}} placeholder="Search product / batch / plant" value={receiptSearch} onChange={e=>{setReceiptSearch(e.target.value);setReceiptPg(1)}}/></div><div className="tablewrap"><table className="table slimcells"><thead><tr><th>Plant</th><th>Product</th><th>Batch No</th><th>MFG</th><th>EXP</th><th>Shelf life</th><th>Batch size</th><th>Packing</th><th>ACC qty / remaining</th><th>RT qty / remaining</th><th>Unit</th><th>Receipt date</th><th>FG release</th><th>Reason</th><th>Actions</th></tr></thead><tbody>{pageRows(receipts.filter(r=>[productName(r.product_id),r.batch_no,r.plant].some(x=>x.toLowerCase().includes(receiptSearch.toLowerCase()))),receiptPg).map(r=><tr key={r.id}><td>{r.plant}</td><td>{productName(r.product_id)}</td><td><b>{r.batch_no}</b></td><td>{stabilityDateDisplay(r.mfg_date)}</td><td>{stabilityDateDisplay(r.exp_date)}</td><td>{stabilityShelf(r.mfg_date,r.exp_date)}M</td><td>{r.batch_size}</td><td>{r.packing_type}</td><td>{r.qty_acc} / <b>{balance(r,'ACC')}</b></td><td>{r.qty_rt} / <b>{balance(r,'RT')}</b></td><td>{r.qty_unit}</td><td>{stabilityDateDisplay(r.received_date)}{r.received_time&&<div className="small">{r.received_time.slice(0,5)}</div>}</td><td>{stabilityDateDisplay(r.fg_release_date)}</td><td title={r.reason_detail||r.reason}>{r.reason}{r.reason_detail&&<div className="small">{r.reason_detail}</div>}</td><td><div className="actions"><button className="btn tiny" onClick={()=>editReceipt(r)}>Edit</button><button className="btn tiny danger" aria-label={'Delete receipt '+r.batch_no} onClick={()=>removeReceipt(r)}><StabilityTrash/></button></div></td></tr>)}</tbody></table></div><Pagination page={receiptPg} setPage={setReceiptPg} total={receipts.filter(r=>[productName(r.product_id),r.batch_no,r.plant].some(x=>x.toLowerCase().includes(receiptSearch.toLowerCase()))).length} per={20}/>{!receipts.length&&<div className="empty">No stability sample receipts yet.</div>}</section>

// QC Flow UI preference: hide browser's previous-entry/autofill suggestions.
// This affects only form presentation, never database records or the actual Auto Fill buttons.
document.addEventListener('focusin', function (event) {
  const field = event.target;
  if (!field || !field.matches || !field.matches('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea')) return;
  field.setAttribute('autocomplete', 'off');
  field.setAttribute('autocorrect', 'off');
  field.setAttribute('autocapitalize', 'off');
  field.setAttribute('spellcheck', 'false');
}, true);
