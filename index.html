/* V3: consistent UI; dashboard cards and charts never grow outside columns */
.dashgrid,.two-col{min-width:0}.dashgrid>.panel,.two-col>.panel{min-width:0;overflow:hidden}
.chartbox,.chartbox canvas{max-width:100%!important;width:100%!important;min-width:0;min-height:0}.chartbox{height:155px!important;overflow:hidden;position:relative}
.chartbox canvas{height:100%!important;max-height:100%!important;display:block}
.chartcontain{width:100%;max-width:100%;min-width:0;height:165px;overflow:hidden;position:relative}
.stat{min-width:0;height:126px;max-height:126px;overflow:hidden}.stat .statvalue,.stat .statnote{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban>*{min-width:0;overflow:hidden}.softfill{min-width:0;overflow:hidden}.softfill h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dashcompact td,.dashcompact th{font-size:10px!important;padding:5px 7px!important;white-space:nowrap}.dashcompact{table-layout:auto}
.table td{vertical-align:middle}.table .tiny{padding:5px 8px}
.result-good{color:var(--success);font-weight:750}.status-hover{cursor:help;display:inline-block}.smallbreak{overflow-wrap:anywhere}
.userpill{min-width:0}.topbar{min-width:0}.section{min-width:0}.tablewrap{max-width:100%}
button,select,.btn,[role='button']{cursor:pointer}input,textarea,[contenteditable='true']{cursor:text}
input[type='checkbox'],input[type='radio']{cursor:pointer}input[type='number']{cursor:text}
input[type='date']:focus,input[type='time']:focus,input[type='number']:focus{cursor:text}
.profile-controls{max-width:260px;min-width:0}.formgrid{min-width:0}
.stage-popup-table td,.stage-popup-table th{font-size:11px;padding:7px 9px}
.audit-wide{width:min(1200px,96vw)!important;max-width:96vw!important}.audit-grid{min-width:1090px}.audit-grid th,.audit-grid td{font-size:10px!important;padding:5px 7px!important;white-space:nowrap}
.audit-grid th{position:sticky;top:0;z-index:2}.audit-detail{max-width:650px;overflow:auto;font-size:11px}
.trendhead{font:800 20px 'Plus Jakarta Sans',sans-serif;margin:10px 0 14px}
.trend-table th{white-space:nowrap}.trend-table td{font-size:11px}
.stage-summary td,.stage-summary th{font-size:11px;padding:9px 10px}
.stage-cell{min-width:135px;white-space:normal}.stage-cell .tag{font-size:10px}
.slimcells td,.slimcells th{font-size:11px;padding:7px 8px}
.pagebody{min-width:0}
@media(max-width:960px){.dashgrid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.kanban{grid-template-columns:1fr 1fr}.chartbox{height:145px!important}}


/* QC LabFlow ONE V4 refinements */
.analyst-tab-selector{display:flex;flex-wrap:wrap;gap:9px;padding:11px;margin-bottom:15px}
.analyst-tab-selector .btn{flex:0 1 auto;min-width:140px}
.readonly-info{display:flex;flex-wrap:wrap;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--muted);font-size:11px}
.readonly-info b{color:var(--text)}
.trend-scroll{max-height:520px;max-width:100%;overflow:auto}
.trend-matrix{min-width:max-content;border-collapse:separate;border-spacing:0}
.trend-matrix th,.trend-matrix td{border-right:1px solid var(--line);padding:8px 11px;white-space:nowrap}
.trend-matrix thead tr:first-child th{top:0;background:var(--surface2);z-index:3}
.trend-matrix thead tr:nth-child(2) th{top:35px;z-index:2}
.trend-matrix thead tr:first-child th.trend-group-head{text-align:center;background:var(--ring);color:var(--primary);height:35px;font-weight:800;letter-spacing:.35px}
.trend-matrix .trend-batch-head{min-width:150px;position:sticky;left:0;z-index:5!important;background:var(--surface2)!important}
.trend-matrix tbody td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px}
.trend-matrix tbody tr:hover td:first-child{background:var(--surface2)}
.trend-matrix .trend-ar{font-weight:700;color:var(--primary)}
.trend-matrix .trend-sub-head{font-size:10px;color:var(--text);min-width:110px}
@media(max-width:650px){.analyst-tab-selector .btn{flex:1 1 100%}}

/* V4.2: elegant Summary hover card; database and data operations unchanged */
.status-hover{cursor:help;display:inline-flex;align-items:center;border-radius:999px;outline-offset:4px;transition:transform .2s ease,box-shadow .2s ease}
.status-hover:hover,.status-hover:focus-visible{transform:translateY(-2px);filter:brightness(.99)}
.status-hover:hover .tag,.status-hover:focus-visible .tag{box-shadow:0 4px 15px var(--ring)}
.qc-status-popover{position:fixed;z-index:120;width:min(390px,calc(100vw - 24px));max-height:min(440px,calc(100vh - 24px));overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:0 20px 54px rgba(13,34,57,.26),0 2px 12px var(--ring);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;line-height:1.55;pointer-events:none;animation:qcTipIn .16s ease both}
.qc-tip-head{position:relative;padding:15px 16px 13px;background:linear-gradient(110deg,var(--surface2),var(--surface));border-bottom:1px solid var(--line);padding-right:100px}
.qc-tip-eyebrow{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--primary);margin-bottom:3px}
.qc-tip-name{font-size:14px;font-weight:800;letter-spacing:-.3px;line-height:1.4;color:var(--text)}
.qc-tip-count{position:absolute;right:14px;top:17px;border:1px solid var(--line);color:var(--muted);background:var(--surface);font-size:10px;font-weight:750;border-radius:30px;padding:5px 8px;white-space:nowrap}
.qc-tip-content{max-height:min(358px,calc(100vh - 105px));overflow:hidden;padding:4px 14px 8px}
.qc-tip-attempt{padding:10px 2px;border-bottom:1px solid var(--line)}
.qc-tip-attempt:last-child{border-bottom:0}
.qc-tip-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;overflow-wrap:anywhere}.qc-tip-meta>b{font-size:11px;line-height:1.3}.qc-tip-meta>.tag{font-size:9px;padding:3px 8px}
.qc-tip-date{display:flex;flex-wrap:wrap;gap:3px 15px;color:var(--muted);font-size:10px;margin:7px 0}.qc-tip-date b{color:var(--text)}

 {modal.type==='productTests'&&<><div className="toolbar"><b>{modal.row.product_code} — {modal.row.product_name}</b><button className="btn tiny" onClick={()=>{setSetupCode(modal.row.product_code);setModal(null);setPage('Product Setup')}}>＋ Add stage tests</button></div><div className="tablewrap"><table className="table stage-popup-table"><thead><tr><th>Stage</th><th>Tests / instrument / weight</th><th>Stage actions</th></tr></thead><tbody>{FIXED_STAGES.map(stage=><tr key={stage}><td><b>{stageLabel(stage)}</b></td><td>{params.filter(t=>t.product_code===modal.row.product_code&&t.test_stage===stage&&t.active!==false).map(t=><div className="actions" style={{marginBottom:5}} key={t.id}><span style={{minWidth:170}}>{t.parameter_name} <span className="small">{t.instrument||''} · {t.weight??1} pts</span></span><button className="btn tiny" onClick={()=>setModal({type:'test',row:t})}>Edit test</button><button className="btn tiny danger" onClick={()=>eraseTest(t)}>Delete test</button></div>)}{!params.some(t=>t.product_code===modal.row.product_code&&t.test_stage===stage&&t.active!==false)&&<span className="small">Not configured</span>}</td><td><div className="actions"><button className="btn tiny" disabled={!stagesForCode(modal.row.product_code).includes(stage)} onClick={()=>setModal({type:'stage',row:{code:modal.row.product_code,stage}})}>Edit stage</button><button className="btn tiny danger" disabled={!stagesForCode(modal.row.product_code).includes(stage)} onClick={()=>eraseStage(modal.row.product_code,stage)}>Delete stage</button></div></td></tr>)}</tbody></table></div><div className="modalactions"><button className="btn" onClick={()=>setModal(null)}>Close</button></div></>}
 {modal.type==='sample'&&<form autoComplete="off" onSubmit={saveSampleEdit}><p className="small">Sample ID: {modal.row.id} · Edits and voiding are recorded in database audit history.</p><div className="formgrid two" style={{marginTop:10}}><div className="formrow"><label>Product</label><select name="product_code" defaultValue={modal.row.product_code} required>{masters.map(p=><option key={p.id} value={p.product_code}>{p.product_name}</option>)}</select></div><div className="formrow"><label>Stage</label><select name="test_stage" defaultValue={modal.row.test_stage} required>{uniq([modal.row.test_stage,...FIXED_STAGES]).map(st=><option value={st} key={st}>{stageLabel(st)}</option>)}</select></div><div className="formrow"><label>Batch number</label><input autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="batch_no" required defaultValue={modal.row.batch_no}/></div><div className="formrow"><label>AR No (optional)</label><input autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="ar_no" defaultValue={modal.row.ar_no||''} placeholder="Can assign later"/></div><div className="formrow"><label>Submission date · QC received submission</label><DateInput autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="submission_date" required defaultValue={modal.row.submission_date||''}/></div><div className="formrow"><label>Actual physical received date</label><DateInput autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="actual_received_date" defaultValue={modal.row.actual_received_date||''}/></div><div className="formrow"><label>Time</label><TimeInput autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="sample_time" defaultValue={modal.row.sample_time||''}/></div><div className="formrow"><label>Sample point</label><input autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="sample_point" defaultValue={modal.row.sample_point||''}/></div><div className="formrow"><label>Batch split letter</label><input autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} className="field" name="split_letter" maxLength="1" defaultValue={modal.row.split_letter||''}/></div><div className="formrow"><label>Validation sample</label><label className="chip"><input autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} type="checkbox" name="is_validation" defaultChecked={Boolean(modal.row.is_validation)}/> Yes</label></div></div><div className="modalactions"><button type="button" className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" type="submit">Save edited sample</button></div><p className="small">Product / stage can be changed before allocation or completion. After testing starts, these fields are protected to preserve test history.</p></form>}

</script><script>
// QC Flow UI preference: hide browser's previous-entry/autofill suggestions.
// This affects only form presentation, never database records or the actual Auto Fill buttons.
document.addEventListener('focusin', function (event) {
  const field = event.target;
  if (!field || !field.matches || !field.matches('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea')) return;
  field.setAttribute('autocomplete', 'off');
  field.setAttribute('autocorrect', 'off');
  field.setAttribute('autocapitalize', 'off');
  field.setAttribute('spellcheck', 'false');
}, true);
</script></body></html>
